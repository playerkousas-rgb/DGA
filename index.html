<!DOCTYPE html><html lang="zh-HK"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026 優異旅團評分系統</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{--green:#1b5e20;--green2:#2e7d32;--greenL:#e8f5e9;--gold:#c8a24a;--ink:#1f2d27;--muted:#5f6b65;--line:#d7e0d8;--bg:#f4f7f4;--red:#c0392b;--amber:#b9770e}
*{box-sizing:border-box}body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
header.top{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top-in{max-width:980px;margin:0 auto;padding:9px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-in h1{font-size:15px;margin:0;font-weight:700}.top-in .sub{font-size:12px;opacity:.9;margin-left:auto}
main{max-width:980px;margin:14px auto 70px;padding:0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.sec-title{font-size:15px;font-weight:800;color:var(--green);margin:18px 0 8px;padding:7px 12px;background:var(--greenL);border-radius:8px;border-left:5px solid var(--green)}
.blk{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:10px 0;background:#fcfdfc}
.blk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px}
.blk-h .pts{font-size:12px;color:var(--green2);font-weight:700;background:var(--greenL);padding:2px 8px;border-radius:10px}
.badge{margin-left:auto;background:var(--green);color:#fff;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:800;min-width:46px;text-align:center}
.note,.ratio-note{font-size:12px;color:var(--muted);margin:6px 0}
.bands{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.band{font-size:11px;background:#eef3ee;border:1px solid var(--line);padding:3px 8px;border-radius:8px;color:var(--muted)}
.band.hit{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.blk-detail{font-size:12.5px;color:var(--green2);background:var(--greenL);padding:6px 10px;border-radius:8px;margin-top:8px;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:6px}
.fld{display:flex;flex-direction:column;gap:3px}.fld>span{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=password],input[type=email],input[type=number],select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff}
input:focus,select:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px rgba(46,125,50,.12)}
.ro{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}.ro b{color:var(--green);font-size:16px}
.yn-list{display:grid;gap:5px;margin-top:6px}
.yn{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.yn-l{font-size:13px}.yn-l em{color:var(--green2);font-style:normal;font-weight:700;font-size:11px}
.yn-o{display:flex;gap:10px}.yn-o label{font-size:13px;display:flex;gap:3px;align-items:center;cursor:pointer}
table.dt,table.dtable{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px;background:#fff}
table.dt th{background:var(--green);color:#fff;padding:7px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap}
table.dt td{padding:4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt td.rs{text-align:center;font-weight:700;color:var(--green);background:var(--greenL)}
.tblwrap,.dwrap{overflow-x:auto}
.min-std{display:grid;gap:6px;margin-top:6px}
.fail{color:var(--red);font-weight:800}.pass{color:var(--green);font-weight:800}
footer.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.bar-in{max-width:980px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.total-box{display:flex;flex-direction:column;line-height:1.1}.total-box .lbl{font-size:11px;color:var(--muted)}.total-box .val{font-size:24px;font-weight:900;color:var(--green)}
.bar-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:9px;padding:10px 15px;font-size:13px;font-weight:700;cursor:pointer}
.btn-pri{background:var(--green);color:#fff}.btn-pri:hover{background:var(--green2)}
.btn-sec{background:#eef3ee;color:var(--ink);border:1px solid var(--line)}.btn-sec:hover{background:#e2eae3}
.btn-gold{background:var(--gold);color:#fff}.btn-lg{padding:18px 22px;font-size:16px;width:100%}
.bigchoice{display:grid;gap:12px;margin-top:8px}
.pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-draft{background:#eee;color:#666}.pill-sub{background:#dbeafe;color:#1e40af}.pill-app{background:#dcfce7;color:#166534}
.pill-fail{background:#fee2e2;color:#991b1b}.pill-pass{background:#dcfce7;color:#166534}.pill-on{background:#dcfce7;color:#166534}.pill-off{background:#eee;color:#666}
.dtable th{background:var(--green);color:#fff;padding:9px 8px;text-align:left;font-weight:600;white-space:nowrap;position:sticky;top:0}
.dtable td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}.dtable tr:hover td{background:var(--greenL)}
.row-act{display:flex;gap:4px;flex-wrap:wrap}
.mini{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}.mini:hover{background:var(--greenL)}
.mini.pri{background:var(--green);color:#fff;border-color:var(--green)}.mini.del{color:var(--red)}
.hint{font-size:11px}.hint.warn{color:var(--amber);font-weight:700}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.stat .n{font-size:22px;font-weight:900;color:var(--green)}.stat .l{font-size:11px;color:var(--muted)}.stat.warn .n{color:var(--amber)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.step{font-size:12px;padding:5px 10px;border-radius:14px;background:#eee;color:#666}.step.on{background:var(--green);color:#fff;font-weight:700}
.readonly-info{background:var(--greenL);border:1px solid #cfe3d0;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.readonly-info b{color:var(--green2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1f2d27;color:#fff;padding:10px 18px;border-radius:24px;z-index:90;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90%;text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid #fff4;border-top:#fff solid;border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}@keyframes sp{to{transform:rotate(360deg)}}
@media print{header.top,footer.bar,.bar-btns,.btn,.steps{display:none!important}body{background:#fff}}
@media(max-width:600px){.top-in h1{font-size:14px}.total-box .val{font-size:20px}.btn{padding:9px 11px;font-size:12px}}
</style></head><body>
<header class="top"><div class="top-in"><h1>🏕️ 2026 優異旅團評分系統</h1><span class="sub" id="topSub">港島地域</span></div></header>
<main><div id="app"></div></main>
<footer class="bar" id="formBar" style="display:none"><div class="bar-in"><div class="total-box"><span class="lbl">總分</span><span class="val" id="totalVal">0</span><span class="pf" id="pfVal">—</span></div><div class="bar-btns" id="barBtns"></div></div></footer>
<div id="toast" class="toast" style="display:none"></div>

<script>
"use strict";
/* ===== GAS RPC 包裝 ===== */
function gas(fn){return function(){const args=[].slice.call(arguments);return new Promise((res,rej)=>{if(inGas()){google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(google.script.run,args);}else if(BACKEND_URL&&!mockMode){fetch(BACKEND_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:fn,args:args}),redirect:"follow"}).then(function(r){return r.json();}).then(res).catch(rej);}else{setTimeout(()=>{try{res((MOCK_API[fn]||function(){return{ok:false,error:"未知功能"};}).apply(null,args));}catch(e){rej(e);}},0);}});};}
const INIT={year:2026,evalYear:2025,districts:[],emails:{},regionEmail:""};
var session=null;        // {token,role,district}
var ctx={};              // {district,groupNo,branchId,sponsor,sections}
var submissionsCache=[];
var editId=null;
var loginMode="district";
var regionFilter="",regionKw="";
const BRANCH_ORDER=[{id:"grasshopper",name:"小童軍團"},{id:"cub",name:"幼童軍團"},{id:"scout",name:"童軍團"},{id:"venture",name:"深資童軍團"},{id:"rover",name:"樂行童軍團"}];
const SECTION_TO_BRANCH={"小童軍":"grasshopper","幼童軍":"cub","童軍":"scout","深資童軍":"venture","樂行童軍":"rover"};

/* ===== UI 工具 ===== */
const $=s=>document.querySelector(s);const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function show(html){$("#app").innerHTML=html;}
function toast(msg,ms){const t=$("#toast");t.textContent=msg;t.style.display="block";clearTimeout(t._t);t._t=setTimeout(()=>t.style.display="none",ms||2600);}
function setBar(btns,showBar){$("#barBtns").innerHTML=btns||"";$("#formBar").style.display=showBar?"block":"none";}

/* ============ 計分引擎（與評分表一致；以文字描述為準）============ */
function get(n){if(FIELDS_SRC!==null){const v=FIELDS_SRC[n];return v===undefined?"":v;}const els=document.querySelectorAll('[name="'+n+'"]');if(!els.length)return"";if(els.length>1||els[0].type==="radio"){for(const el of els)if(el.checked)return el.value;return"";}return els[0].value;}
function num(n){const v=get(n);return v===""?0:(parseFloat(v)||0);}
function str(n){return get(n);}
function setText(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
function setHTML(id,h){const e=document.getElementById(id);if(e)e.innerHTML=h;}
function tierScore(v,tiers){let r=0;for(const[t,s]of tiers)if(v>=t)r=s;return r;}
function textField(n,l,ph,req){return '<label class="fld"><span>'+l+(req?' <span style="color:#c0392b">*</span>':'')+'</span><input type="text" name="'+n+'" placeholder="'+(ph||'')+'"></label>';}
function numField(n,l){return '<label class="fld"><span>'+l+'</span><input type="number" inputmode="numeric" min="0" name="'+n+'"></label>';}
function selField(n,l,opts,req){return '<label class="fld"><span>'+l+(req?' <span style="color:#c0392b">*</span>':'')+'</span><select name="'+n+'"><option value=""></option>'+opts.map(o=>"<option>"+o+"</option>").join("")+'</select></label>';}
function ynField(n,l,p){return '<div class="yn"><span class="yn-l">'+l+' <em>('+p+'分)</em></span><span class="yn-o"><label><input type="radio" name="'+n+'" value="有"> 有</label><label><input type="radio" name="'+n+'" value="無"> 無</label></span></div>';}

function blockMembers(cfg){return{key:"members",section:"甲",cfg,title(){return"1. 成員人數";},max(){return cfg.max;},
  render(){return '<div class="blk"><div class="blk-h"><span>'+this.title()+'</span><span class="pts">[佔'+cfg.max+'分]</span><span class="badge" id="sc_members">0</span></div><div class="grid2">'+numField("members_mBoy","青少年成員 男（人）")+numField("members_mGirl","青少年成員 女（人）")+'<div class="ro"><span>全團合計</span><b id="members_total">0</b><span>人</span></div>'+numField("members_lBoy","領袖 男（人）")+numField("members_lGirl","領袖 女（人）")+numField("members_appoint","持有委任書（人）")+numField("members_temp","持有暫許委任書（人）")+numField("members_wood","領袖持有木章（人）")+'</div><div class="bands" id="members_bands"></div><div class="ratio-note">領袖與成員比例：1位領袖最多對8名成員 → 達標得2分</div><div class="blk-detail" id="det_members"></div></div>';},
  score(){const mBoy=num("members_mBoy"),mGirl=num("members_mGirl"),total=mBoy+mGirl;const lBoy=num("members_lBoy"),lGirl=num("members_lGirl"),ltotal=lBoy+lGirl;const ap=num("members_appoint"),tp=num("members_temp"),atotal=ap+tp;const wood=num("members_wood");setText("members_total",total);const ms=tierScore(total,cfg.memberTiers),ls=ltotal<2?0:(ltotal>=4?3:2),as=atotal<1?0:(atotal>=2?2:1),rs=(ltotal>0&&total/ltotal<=8)?2:0,ws=wood<1?0:(wood>=2?2:1);const bandsEl=$("#members_bands");if(bandsEl){let hit=-1;cfg.tierLabels.forEach((t,i)=>{if(total>=t)hit=i;});bandsEl.innerHTML=cfg.bands.map((b,i)=>'<span class="band'+(i===hit&&total>0?' hit':'')+'">'+b+'</span>').join("");}const score=ms+ls+as+rs+ws;setHTML("det_members",'成員人數 '+ms+' ＋ 領袖人數 '+ls+' ＋ 委任書 '+as+' ＋ 比例 '+rs+' ＋ 木章 '+ws+' ＝ <b>'+score+'/'+cfg.max+'</b>');return score;},
  data(){return[["青少年成員 男（人）",num("members_mBoy")],["女（人）",num("members_mGirl")],["領袖 男（人）",num("members_lBoy")],["女（人）",num("members_lGirl")],["持有委任書（人）",num("members_appoint")],["暫許委任書（人）",num("members_temp")],["木章（人）",num("members_wood")]];}};}
function blockProgressRatio(cfg){return{key:"progress",section:"甲",cfg,title(){return cfg.title;},max(){return cfg.max;},
  render(){return '<div class="blk"><div class="blk-h"><span>'+cfg.title+'</span><span class="pts">[佔'+cfg.max+'分]</span><span class="badge" id="sc_progress">0</span></div><div class="note">'+cfg.note+'</div><div class="grid2">'+cfg.items.map((it,i)=>numField("progress_"+i,it.n+" 人次")).join("")+'</div><div class="bands">'+cfg.bands.map(b=>'<span class="band">'+b+'</span>').join("")+'</div><div class="blk-detail" id="det_progress"></div></div>';},
  score(){let sum=0;cfg.items.forEach((it,i)=>sum+=num("progress_"+i));const total=num("members_mBoy")+num("members_mGirl");const ratio=total>0?sum/total:0;const sc=total>0?tierScore(ratio,cfg.tiers):0;setHTML("det_progress",'考獲人次合計 '+sum+'，佔全團 '+total+' 人 = '+(ratio*100).toFixed(0)+'% → <b>'+sc+'/'+cfg.max+'</b>');return sc;},
  data(){return cfg.items.map((it,i)=>[it.n+" 人次",num("progress_"+i)]);}};}
function blockProgressSum(cfg){return{key:"progress",section:"甲",cfg,title(){return cfg.title;},max(){return"∞";},
  render(){return '<div class="blk"><div class="blk-h"><span>'+cfg.title+'</span><span class="pts">[分數不設上限]</span><span class="badge" id="sc_progress">0</span></div><div class="note">'+cfg.note+'</div><div class="grid2">'+cfg.items.map((it,i)=>numField("progress_"+i,it.n+"（"+it.pts+"分／位）")).join("")+'</div><div class="blk-detail" id="det_progress"></div></div>';},
  score(){let sc=0;cfg.items.forEach((it,i)=>sc+=num("progress_"+i)*it.pts);setHTML("det_progress",'合共 <b>'+sc+'</b> 分（不設上限）');return sc;},data(){return cfg.items.map((it,i)=>[it.n,num("progress_"+i)]);}};}
function blockTopAward(cfg){return{key:"topaward",section:"甲",cfg,title(){return cfg.title;},max(){return"∞";},
  render(){return '<div class="blk"><div class="blk-h"><span>'+cfg.title+'</span><span class="pts">[分數不設上限]</span><span class="badge" id="sc_topaward">0</span></div><div class="note">'+cfg.note+'</div><div class="grid2">'+cfg.items.map((it,i)=>numField("topaward_"+i,it.n+"（"+it.pts+"分／位）")).join("")+'</div><div class="blk-detail" id="det_topaward"></div></div>';},
  score(){let sc=0;cfg.items.forEach((it,i)=>sc+=num("topaward_"+i)*it.pts);setHTML("det_topaward",'計入總分：<b>'+sc+'</b> 分（不設上限）');return sc;},data(){return cfg.items.map((it,i)=>[it.n,num("topaward_"+i)]);}};}
function blockTopAwardCub(cfg){return{key:"topaward",section:"甲",cfg,title(){return cfg.title;},max(){return"∞";},
  render(){return '<div class="blk"><div class="blk-h"><span>'+cfg.title+'</span><span class="pts">[分數不設上限]</span><span class="badge" id="sc_topaward">0</span></div><div class="note">'+cfg.note+'</div><div class="blk-detail" id="det_topaward"></div></div>';},
  score(){const v=num("progress_3");setHTML("det_topaward",'金紫荊獎章 '+v+' 人 × 1 = <b>'+v+'</b> 分（不設上限；數值取自上面金紫荊一欄）');return v;},data(){return[["金紫荊獎章（人）",num("progress_3")]];}};}
function ADMIN(items){return items.map((it,i)=>({k:"a"+i,n:it.n,p:it.p}));}
function blockAdmin(items,max){return{key:"admin",section:"乙",title(){return"（乙）行政與財務管理";},max(){return max;},
  render(){return '<div class="blk"><div class="blk-h"><span>（乙）行政與財務管理 — 期間可供審閱的記錄</span><span class="pts">[共'+max+'分]</span><span class="badge" id="sc_admin">0</span></div><div class="yn-list">'+items.map((it,i)=>ynField("admin_"+it.k,it.n,it.p)).join("")+'</div><div class="blk-detail" id="det_admin"></div></div>';},
  score(){let s=0;items.forEach(it=>{if(str("admin_"+it.k)==="有")s+=it.p;});setHTML("det_admin",'合共 <b>'+s+'/'+max+'</b> 分');return s;},data(){return items.map(it=>[it.n+"（"+it.p+"分）",str("admin_"+it.k)]);}};}
function blockMeeting(){return{key:"meeting",section:"丙",title(){return"1. 團集會";},max(){return 20;},
  render(){return '<div class="blk"><div class="blk-h"><span>1. 團集會</span><span class="pts">[佔20分]</span><span class="badge" id="sc_meeting">0</span></div><div class="note">每次集會得2分，最高可獲20分。</div><div class="grid2">'+numField("meeting_n","常規團集會 次數")+'</div><div class="blk-detail" id="det_meeting"></div></div>';},
  score(){const n=num("meeting_n");const sc=Math.min(n*2,20);setHTML("det_meeting",n+' 次 × 2 = <b>'+sc+'/20</b>');return sc;},data(){return[["常規團集會 次數",num("meeting_n")]];}};}
const COL={date:{k:"date",label:"日期",type:"text",w:"92px"},name:{k:"name",label:"活動名稱",type:"text"},ppl:{k:"ppl",label:"參加人數",type:"number",w:"84px"},result:{k:"result",label:"成績",type:"text",w:"100px"}};
function catCol(o){return{k:"cat",label:"類別",type:"select",options:o,w:"120px"};}
function nameCol(l){return{k:"name",label:l||"比賽項目",type:"text"};}
function mkTable(o){const cap=(o.max==="∞")?Infinity:o.max;return{key:o.key,section:o.section||"丙",cfg:o,title(){return o.title;},max(){return o.max;},

var currentBranch=BRANCHES[0],SCORES={},MIN_FAIL=false;

function formHeaderHTML(b){return '<div class="card"><div style="font-weight:800;color:var(--green);font-size:16px;margin-bottom:6px">'+b.name+' 評分表（'+INIT.year+' 年優異旅團）</div><div style="font-size:12px;color:var(--muted);margin-bottom:10px">香港童軍總會 ~ 港島地域　·　評選期：'+INIT.evalYear+'-01-01 至 '+INIT.evalYear+'-12-31</div><div class="readonly-info">旅號／旅團：<b>'+esc(ctx.groupNo)+'</b>　|　區別：<b>'+esc(ctx.district)+'</b>'+(ctx.sponsor?'<br>主辦機構：'+esc(ctx.sponsor):'')+'</div><div class="grid2">'+selField("h_type","團類別",b.typeOpts)+textField("h_meetingPlace","集會地點*","")+textField("h_meetingTime","集會時間","")+textField("h_leader","負責領袖姓名*","")+textField("h_phone","聯絡電話*","")+selField("h_position","童軍職位",b.positions)+textField("h_email","電郵地址*","")+'</div></div>';}
function minStdHTML(b){const items=["1. 最少有 "+b.minMembers+" 名團員",b.minStd2,"3. 呈交 "+INIT.evalYear+"／"+INIT.year+" 年度財政報告","4. 於「青少年成員資訊系統」（YMIS）系統註冊"];return '<div class="card"><div class="sec-title">⭐ 最低標準（全部須達「有」方可獲評選）</div><div class="min-std">'+items.map((t,i)=>{const y=ynField("ms_"+i,t,0);return y.replace(' <em>(0分)</em>','');}).join("")+'</div><div class="blk-detail" id="det_ms"></div></div>';}
function sigHTML(){return '<div class="card"><div class="sec-title">✍️ 簽署／備註</div><div class="grid2">'+textField("sig_ev_name","評審員 姓名","")+textField("sig_ev_pos","評審員 職位","")+textField("sig_ev_date","評審員 日期","")+textField("sig_dc_date","區總監 日期","")+'</div></div>';}
function renderForm(branchId,fields){currentBranch=BRANCHES.find(b=>b.id===branchId)||BRANCHES[0];let html=formHeaderHTML(currentBranch)+minStdHTML(currentBranch);const secs={"甲":"（甲）童軍旅團標準","乙":"（乙）行政與財務管理","丙":"（丙）訓練與活動"};["甲","乙","丙"].forEach(sec=>{const blks=currentBranch.blocks.filter(bl=>bl.section===sec);if(!blks.length)return;html+='<div class="sec-title">'+secs[sec]+'</div>';blks.forEach(bl=>html+=bl.render());});html+=sigHTML();show(html);$("#app").querySelectorAll("input,select").forEach(el=>{el.addEventListener("input",recompute);el.addEventListener("change",recompute);});if(fields)Object.entries(fields).forEach(([k,v])=>{const els=document.querySelectorAll('[name="'+k+'"]');if(!els.length)return;if(els.length>1||els[0].type==="radio"){els.forEach(e=>e.checked=(e.value===v));}else els[0].value=v;});recompute();}
function recompute(){let total=0;currentBranch.blocks.forEach(bl=>{const s=bl.score();SCORES[bl.key]=s;setText("sc_"+bl.key,s);total+=s;});let fail=false,any=false;for(let i=0;i<4;i++){const v=str("ms_"+i);if(v==="無")fail=true;if(v==="有"||v==="無")any=true;}MIN_FAIL=fail;setHTML("det_ms",fail?'<span class="fail">⚠ 未達最低標準（有項目為「無」）</span>':(any?'<span class="pass">✓ 已確認全部最低標準為「有」</span>':"請確認各項最低標準"));setText("totalVal",total);setHTML("pfVal",fail?'<span class="fail">未達最低標準</span>':'<span class="pass">符合最低標準</span>');}
function collectFields(){const f={};document.querySelectorAll("#app [name]").forEach(el=>{if(el.type==="radio"){if(el.checked)f[el.name]=el.value;}else f[el.name]=el.value;});return f;}
function totalFromScores(){let t=0;for(const k in SCORES)t+=SCORES[k]||0;return t;}
function buildSummary(){const L=[];currentBranch.blocks.forEach(bl=>{L.push(bl.title()+"："+(SCORES[bl.key]||0)+" 分");});return L.join("\n");}

function regionSetStatus(id){const r=submissionsCache.find(x=>x.id===id);if(!r)return;const order=["草擬","已遞交","已批核"];const ns=order[(order.indexOf(r.status||"草擬")+1)%order.length];gas("saveSubmission")(session.token,{id,district:r.district,status:ns,total:r.total,passFail:r.passFail,fields:r.fields,scores:r.scores,summary:r.summary,branchName:r.branchName}).then(res=>{if(res.ok){toast("已改為「"+ns+"」");refreshDash();}else toast(res.error);}).catch(e=>toast(e.message));}
function loadRegionConfig(){gas("getDistrictsConfig")(session.token).then(r=>{if(!r.ok){$("#rconfig").innerHTML='<p style="color:var(--red)">'+esc(r.error)+'</p>';return;}INIT.regionEmail=r.regionEmail||INIT.regionEmail;let h='<div class="readonly-info" style="margin-bottom:10px">ℹ️ 電郵／密碼儲存於試算表 <code>Districts</code> 工作表；可喺度直接改，亦可打開 Google 試算表直接修改（即時生效，毋須重新部署 GAS）。</div>';h+='<div style="display:grid;gap:6px;margin-bottom:8px"><label class="fld"><span>地域電郵（批核轉交目的地）</span><input type="email" id="rc_regionemail" value="'+esc(INIT.regionEmail)+'"></label><div><button class="mini pri" onclick="regionSaveRegionEmail()">儲存地域電郵</button></div></div>';h+='<div style="display:grid;gap:6px;margin-bottom:10px"><label class="fld"><span>新地域管理員密碼（至少 6 位）</span><input type="text" id="rc_regionpw" placeholder="更改地域密碼…"></label><div><button class="mini" onclick="regionSaveRegionPw()">更改地域密碼</button></div></div>';h+='<h4 style="margin:8px 0 6px">各區電郵／密碼</h4><div class="dwrap"><table class="dtable"><thead><tr><th>區別</th><th>區電郵</th><th>區密碼</th><th>操作</th></tr></thead><tbody>';r.districts.forEach(d=>{h+='<tr><td><b>'+esc(d.district)+'</b></td><td><input type="email" id="rc_em_'+esc(d.district)+'" value="'+esc(d.email)+'"></td><td><code>'+esc(d.password)+'</code></td><td class="row-act"><button class="mini pri" onclick="regionSaveDistEmail(\''+esc(d.district)+'\')">儲存電郵</button><button class="mini" onclick="regionRegenPw(\''+esc(d.district)+'\')">重設密碼</button></td></tr>';});h+='</tbody></table></div>';$("#rconfig").innerHTML=h;}).catch(e=>toast(e.message));}
function regionSaveRegionEmail(){const v=$("#rc_regionemail").value;gas("setRegionEmail")(session.token,v).then(r=>{if(r.ok){INIT.regionEmail=r.regionEmail;toast("地域電郵已更新");}else toast(r.error);}).catch(e=>toast(e.message));}
function regionSaveRegionPw(){const v=$("#rc_regionpw").value;gas("setRegionPassword")(session.token,v).then(r=>{toast(r.ok?"地域密碼已更改":(r.error||"失敗"));if(r.ok)$("#rc_regionpw").value="";}).catch(e=>toast(e.message));}
function regionSaveDistEmail(d){const v=$("#rc_em_"+d).value;gas("setDistrictEmail")(session.token,d,v).then(r=>{if(r.ok){INIT.emails[d]=v;toast(d+" 電郵已更新");}else toast(r.error);}).catch(e=>toast(e.message));}
function regionRegenPw(d){if(!confirm("重設「"+d+"」區密碼？舊密碼將失效。"))return;gas("regenerateDistrictPassword")(session.token,d).then(r=>{if(r.ok){toast(d+" 新密碼："+r.password);loadRegionConfig();}else toast(r.error);}).catch(e=>toast(e.message));}
function regionExport(){const rows=submissionsCache.slice().sort((a,b)=>(a.district||"").localeCompare(b.district||""));const A=[[INIT.year+" 優異旅團 — 全區總表"],["地域電郵："+(INIT.regionEmail||"未設定")],[],["區別","旅團","支部","總分","最低標準","狀態","上年","負責領袖","電話","電郵","最後更新"]];rows.forEach(r=>{A.push([r.district,r.groupNo,r.branchName,r.total,r.passFail==="fail"?"未達":"符合",r.status||"",r.lastYear?"有":"無",r.leader||"",r.phone||"",r.email||"",r.updatedAt?new Date(r.updatedAt).toLocaleString("zh-HK"):""]);});const fname=(INIT.year+"_DGA_全區總表").replace(/[\\/:*?"<>|]/g,"_");if(typeof XLSX!=="undefined"){try{const ws=XLSX.utils.aoa_to_sheet(A);ws["!cols"]=[{wch:10},{wch:18},{wch:12},{wch:7},{wch:10},{wch:10},{wch:6},{wch:14},{wch:12},{wch:20},{wch:20}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"總表");XLSX.writeFile(wb,fname+".xlsx");return;}catch(e){}}toast("匯出已開始");}

/* ============ 畫面：修改紀錄 ============ */
function goEdit(id){const r=submissionsCache.find(x=>x.id===id);if(!r){toast("找不到紀錄");return;}editId=id;ctx={district:r.district,groupNo:r.groupNo,sponsor:"",branchId:r.branchId};renderForm(r.branchId,r.fields);setBar('<button class="btn btn-sec" onclick="goDashboard()">← 返回總表</button><button class="btn btn-sec" onclick="saveEdit()">💾 儲存修改</button>',true);}
function saveEdit(){recompute();const fields=collectFields();const payload={id:editId,district:session.district,branchName:currentBranch.name,type:fields.h_type||"",leader:fields.h_leader||"",phone:fields.h_phone||"",email:fields.h_email||"",position:fields.h_position||"",meetingPlace:fields.h_meetingPlace||"",meetingTime:fields.h_meetingTime||"",fields,scores:Object.assign({},SCORES),total:totalFromScores(),passFail:MIN_FAIL?"fail":"pass",summary:buildSummary()};setBar('<span class="spin"></span> 儲存中…',false);gas("saveSubmission")(session.token,payload).then(r=>{toast(r.ok?"✓ 已儲存":(r.error||"失敗"));if(r.ok)goDashboard();else setBar('<button class="btn btn-sec" onclick="goDashboard()">← 返回總表</button><button class="btn btn-sec" onclick="saveEdit()">重試儲存</button>',true);}).catch(e=>toast(e.message));}

/* ===== MOCK 示範模式（免部署體驗；資料只存瀏覽器，不寫入 Google Sheet）===== */
var FIELDS_SRC=null;
var mockMode=false;
function inGas(){return (typeof google!=="undefined"&&google.script&&google.script.run);}
var BACKEND_URL="";
async function bootMode(){if(inGas())return "gas";try{const q=new URLSearchParams(location.search).get("backend");if(q){BACKEND_URL=q;try{localStorage.setItem("dga_backend",q);}catch(e){}return "fetch";}const ls=localStorage.getItem("dga_backend");if(ls){BACKEND_URL=ls;return "fetch";}}catch(e){}try{const c=await fetch("data/config.json",{cache:"no-store"}).then(r=>r.json());if(c&&c.backend){BACKEND_URL=c.backend;return "fetch";}}catch(e){}return "mock";}
var MOCK={submissions:[],sessions:{},distPw:{},distEmail:{},regionPassword:"demo",regionEmail:""};
function mockSave(){try{localStorage.setItem("dga_mock",JSON.stringify(MOCK));}catch(e){}}
function mockLoad(){try{const s=JSON.parse(localStorage.getItem("dga_mock")||"null");if(s)MOCK=s;}catch(e){}if(!MOCK.submissions)MOCK.submissions=[];if(!MOCK.sessions)MOCK.sessions={};if(!MOCK.distPw)MOCK.distPw={};if(!MOCK.distEmail)MOCK.distEmail={};}
function DIST_LIST(){const a=[];GROUPS_DATA.forEach(g=>{if(a.indexOf(g.d)<0)a.push(g.d);});return a;}
function summaryFromScores(branchId,scores){const b=BRANCHES.find(x=>x.id===branchId);const L=[];if(b)b.blocks.forEach(bl=>L.push(bl.title()+"："+(scores[bl.key]||0)+" 分"));return L.join("\n");}
function computeScores(branchId,fields){const b=BRANCHES.find(x=>x.id===branchId);if(!b)return{scores:{},total:0,passFail:"pass"};const prev=currentBranch;currentBranch=b;FIELDS_SRC=fields;const sc={};let total=0;b.blocks.forEach(bl=>{const s=bl.score();sc[bl.key]=s;total+=s;});let fail=false;for(let i=0;i<4;i++){if(fields["ms_"+i]==="無")fail=true;}FIELDS_SRC=null;currentBranch=prev;return{scores:sc,total:total,passFail:fail?"fail":"pass"};}
function mockFields(branchId,g,seed){let st=seed||12345;const rnd=()=>{st=(st*9301+49297)%233280;return st/233280;};const ri=(a,b)=>Math.floor(rnd()*(b-a+1))+a;const bn=BRANCHES.find(x=>x.id===branchId);
  const f={h_type:(bn&&bn.typeOpts&&bn.typeOpts[0])||"",h_leader:"示範領袖"+ri(1,99),h_phone:"5555 "+ri(1000,9999),h_email:"demo@example.org",h_position:(bn&&bn.positions&&bn.positions[2])||"",h_meetingPlace:g.sponsor,h_meetingTime:"逢星期六 14:00"};
  f.members_mBoy=ri(6,22);f.members_mGirl=ri(4,18);f.members_lBoy=ri(1,3);f.members_lGirl=ri(0,3);f.members_appoint=ri(1,3);f.members_temp=ri(0,2);f.members_wood=ri(0,2);
  f.progress_0=ri(0,8);f.progress_1=ri(0,6);f.progress_2=ri(0,4);f.progress_3=ri(0,3);
  f.topaward_0=ri(0,3);f.topaward_1=ri(0,2);
  for(let i=0;i<11;i++)f["admin_a"+i]=(rnd()>0.35?"有":"");
  f.meeting_n=ri(4,14);f.ms_0="有";f.ms_1="有";f.ms_2="有";f.ms_3="有";
  f.act1_0_date="2025-0"+ri(1,9)+"-1"+ri(0,9);f.act1_1_date=rnd()>0.5?("2025-1"+ri(0,2)+"-0"+ri(1,9)):"";f.act1_0_cat="會員大會";f.act1_1_cat="其他";
  f.act2_0_date="2025-0"+ri(3,9)+"-1"+ri(0,9);f.act2_0_cat=(rnd()>0.5?"活動":"訓練");if(rnd()>0.6){f.act2_1_date="2025-1"+ri(0,1)+"-0"+ri(1,9);f.act2_1_cat="訓練 / 工作坊";}
  f.act3_0_date="2025-0"+ri(4,9)+"-2"+ri(0,8);f.act3_0_cat="活動";
  f.service_0_date="2025-0"+ri(5,9)+"-1"+ri(0,9);f.service_0_cat="社區服務";
  f.comp_0_name="區比賽示例";f.comp_0_cat="區比賽";
  if(branchId==="cub")f.compsingle_0_name="香港總監挑戰盾";
  if(branchId==="venture")f.compsingle_0_name="全港深資童軍錦標賽";
  if(branchId==="rover"){f.compsingle_0_name="全港樂行童軍錦標賽";f.moot_0_name="陳大文";if(rnd()>0.5)f.moot_1_name="李四";}
  return f;}
function seedMock(){
  if(!MOCK.distPw||!Object.keys(MOCK.distPw).length){DIST_LIST().forEach(d=>{MOCK.distPw[d]="demo";MOCK.distEmail[d]="info@skwscout.org.hk";});}
  if(!MOCK.regionPassword)MOCK.regionPassword="demo";if(!MOCK.regionEmail)MOCK.regionEmail="info@skwscout.org.hk";
  if(!MOCK.submissions)MOCK.submissions=[];if(!MOCK.submissions.length){
    const byD={};GROUPS_DATA.forEach(g=>{(byD[g.d]=byD[g.d]||[]).push(g);});
    const branches=["grasshopper","cub","scout","venture","rover"];let n=0;
    DIST_LIST().forEach((d,di)=>{const gs=byD[d]||[];const cnt=2+(di%2);
      for(let k=0;k<cnt&&k<gs.length;k++){const g=gs[k%gs.length];const secs=g.sections&&g.sections.length?g.sections:branches;const sec=secs[k%secs.length];const bid=SECTION_TO_BRANCH[sec]||branches[(di+k)%5];
        const fields=mockFields(bid,g,(di*131+k*7+101));
        const cs=computeScores(bid,fields);const bn=BRANCHES.find(x=>x.id===bid);
        const status=(n%5===0)?"草擬":((n%3===0)?"已批核":"已遞交");
        MOCK.submissions.push({id:"M"+(1000+n),createdAt:"2025-0"+(1+(n%8))+"-1"+(n%9),updatedAt:"2025-"+(1+(n%6))+"-"+(10+(n%18)),year:2026,district:d,groupNo:g.no,branchId:bid,branchName:bn.name,type:fields.h_type,leader:fields.h_leader,phone:fields.h_phone,email:fields.h_email,position:fields.h_position,meetingPlace:fields.h_meetingPlace,meetingTime:fields.h_meetingTime,fields:fields,scores:cs.scores,total:cs.total,passFail:cs.passFail,status:status,lastYear:(n%4===0),approvedAt:status==="已批核"?("2025-1"+(n%2)+"-0"+(1+n%9)):"",submitterEmail:"",summary:summaryFromScores(bid,cs.scores)});
        n++;}});
  }
  mockSave();}
function mockReset(){if(!confirm("清除所有示範數據並重新產生？"))return;MOCK={submissions:[],sessions:{},distPw:{},distEmail:{},regionPassword:"demo",regionEmail:""};seedMock();toast("已重置示範數據");goHome();}
function mockEnter(){mockMode=true;mockLoad();if(!MOCK.submissions||!MOCK.submissions.length)seedMock();goHome();}
function mockExit(){mockMode=false;goHome();}
function mockSeedAndRegion(){mockLoad();if(!MOCK.submissions||!MOCK.submissions.length)seedMock();MOCK.sessions["MOCKTOK_R"]={district:"*",role:"region"};session={token:"MOCKTOK_R",role:"region",district:"*"};goDashboard();}
const MOCK_API={
  getInit(){return{ok:true,year:2026,evalYear:2025,districts:DIST_LIST(),emails:Object.assign({},MOCK.distEmail),regionEmail:MOCK.regionEmail};},
  getGroups(d){return GROUPS_DATA.filter(g=>g.d===d).map(g=>({no:g.no,sponsor:g.sponsor,sections:g.sections}));},
  submitForm(p){const id="M"+Date.now();const now=new Date().toISOString();MOCK.submissions.push(Object.assign({id,createdAt:now,updatedAt:now,year:2026,approvedAt:""},p,{status:p.status||"已遞交"}));mockSave();return{ok:true,id,emailSent:!!(MOCK.distEmail[p.district]),districtEmail:MOCK.distEmail[p.district]||""};},
  login(d,pw){if((MOCK.distPw[d]||"demo")===pw){const t="MTOK_D_"+d;MOCK.sessions[t]={district:d,role:"district"};mockSave();return{ok:true,token:t,district:d,role:"district"};}return{ok:false,error:"區別或密碼不正確（示範密碼：demo）"};},
  loginRegion(pw){if((MOCK.regionPassword||"demo")===String(pw)){MOCK.sessions["MTOK_R"]={district:"*",role:"region"};mockSave();return{ok:true,token:"MTOK_R",role:"region"};}return{ok:false,error:"地域密碼不正確（示範密碼：demo）"};},
  listSubmissions(token){const s=MOCK.sessions[token];if(!s)return{ok:false,error:"登入已失效"};const out=MOCK.submissions.filter(r=>s.role==="region"||r.district===s.district).map(r=>Object.assign({},r,{fields:r.fields,scores:r.scores}));return{ok:true,submissions:out,role:s.role,regionEmail:MOCK.regionEmail};},
  saveSubmission(token,p){const s=MOCK.sessions[token];if(!s)return{ok:false,error:"登入已失效"};const r=MOCK.submissions.find(x=>x.id===p.id);if(!r)return{ok:false,error:"找不到紀錄"};Object.assign(r,p);if(p.status!==undefined)r.status=p.status;r.updatedAt=new Date().toISOString();mockSave();return{ok:true};},
  deleteSubmission(token,id){MOCK.submissions=MOCK.submissions.filter(x=>x.id!==id);mockSave();return{ok:true};},
  approveOne(token,id){const s=MOCK.sessions[token];const r=MOCK.submissions.find(x=>x.id===id);if(r&&s&&s.role==="district"){r.status="已批核";r.approvedAt=new Date().toISOString();}mockSave();return{ok:true};},
  bulkSend(token){const s=MOCK.sessions[token];let n=0;MOCK.submissions.forEach(r=>{if(s&&(s.role==="region"||r.district===s.district)&&r.status==="已遞交"){r.status="已批核";r.approvedAt=new Date().toISOString();n++;}});mockSave();return{ok:true,count:n};},
  getDistrictsConfig(token){const s=MOCK.sessions[token];if(!s||s.role!=="region")return{ok:false,error:"只限地域管理員"};return{ok:true,districts:DIST_LIST().map(d=>({district:d,email:MOCK.distEmail[d]||"",password:MOCK.distPw[d]||"demo"})),regionEmail:MOCK.regionEmail};},
  setDistrictEmail(token,d,email){const s=MOCK.sessions[token];if(!s||s.role!=="region")return{ok:false};MOCK.distEmail[d]=email;mockSave();return{ok:true};},
  regenerateDistrictPassword(token,d){const s=MOCK.sessions[token];if(!s||s.role!=="region")return{ok:false};const pw="dm"+Math.floor(Math.random()*9000+1000);MOCK.distPw[d]=pw;mockSave();return{ok:true,password:pw};},
  setRegionEmail(token,email){const s=MOCK.sessions[token];if(!s||s.role!=="region")return{ok:false};MOCK.regionEmail=email;mockSave();return{ok:true,regionEmail:email};},
  setRegionPassword(token,pw){const s=MOCK.sessions[token];if(!s||s.role!=="region")return{ok:false};if(String(pw).length<6)return{ok:false,error:"密碼至少 6 位"};MOCK.regionPassword=pw;mockSave();return{ok:true};}
};

/* ===== 啟動 ===== */
window.addEventListener("load",()=>{bootMode().then(mode=>{if(mode==="mock"){mockMode=true;mockLoad();if(!MOCK.submissions||!MOCK.submissions.length)seedMock();}gas("getInit")().then(init=>{Object.assign(INIT,init);$("#topSub").textContent="港島地域"+(mode==="mock"?" · 示範模式":(mode==="fetch"?" · 雲端":""))+" · "+init.year;goHome();}).catch(e=>{show('<div class="card">無法連接伺服器：'+esc(e.message)+'</div>');});});});
