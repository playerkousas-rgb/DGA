<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 優異旅團獎勵計劃 — 評分表 APP</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root{
  --green:#1b5e20; --green2:#2e7d32; --greenL:#e8f5e9; --gold:#c8a24a;
  --ink:#1f2d27; --muted:#5f6b65; --line:#d7e0d8; --bg:#f4f7f4; --card:#ffffff;
  --red:#c0392b; --amber:#b9770e;
}
*{box-sizing:border-box}
body{margin:0;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
header.top{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top-in{max-width:980px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-in h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.5px}
.top-in .sub{font-size:12px;opacity:.9}
.tabs{max-width:980px;margin:8px auto 0;padding:0 10px;display:flex;gap:6px;flex-wrap:wrap}
.tab{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.25);padding:7px 13px;border-radius:20px;font-size:13px;cursor:pointer;font-weight:600;transition:.15s}
.tab:hover{background:rgba(255,255,255,.28)}
.tab.active{background:#fff;color:var(--green);border-color:#fff}
.gear{margin-left:auto;background:rgba(255,255,255,.18);border:none;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer}
main{max-width:980px;margin:14px auto 70px;padding:0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.sec-title{font-size:15px;font-weight:800;color:var(--green);margin:18px 0 8px;padding:7px 12px;background:var(--greenL);border-radius:8px;border-left:5px solid var(--green)}
.blk{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:10px 0;background:#fcfdfc}
.blk-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;font-size:14px;color:var(--ink)}
.blk-h .pts{font-size:12px;color:var(--green2);font-weight:700;background:var(--greenL);padding:2px 8px;border-radius:10px}
.badge{margin-left:auto;background:var(--green);color:#fff;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:800;min-width:46px;text-align:center}
.note,.ratio-note{font-size:12px;color:var(--muted);margin:6px 0}
.bands{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.band{font-size:11px;background:#eef3ee;border:1px solid var(--line);padding:3px 8px;border-radius:8px;color:var(--muted)}
.band.hit{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.blk-detail{font-size:12.5px;color:var(--green2);background:var(--greenL);padding:6px 10px;border-radius:8px;margin-top:8px;font-weight:600}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:6px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld>span{font-size:12px;color:var(--muted);font-weight:600}
input[type=text],input[type=number],select{width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--green2);box-shadow:0 0 0 3px rgba(46,125,50,.12)}
.ro{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.ro b{color:var(--green);font-size:16px}
.yn-list{display:grid;grid-template-columns:1fr;gap:5px;margin-top:6px}
.yn{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.yn-l{font-size:13px}
.yn-l em{color:var(--green2);font-style:normal;font-weight:700;font-size:11px}
.yn-o{display:flex;gap:10px}
.yn-o label{font-size:13px;display:flex;gap:3px;align-items:center;cursor:pointer}
table.dt{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
table.dt th{background:var(--green);color:#fff;padding:7px;text-align:left;font-weight:600;font-size:12px;white-space:nowrap}
table.dt td{padding:4px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt td.sc,table.dt th.sc{text-align:center;width:54px}
table.dt td.rs{text-align:center;font-weight:700;color:var(--green);background:var(--greenL)}
.tblwrap{overflow-x:auto}
.min-std{display:grid;gap:6px;margin-top:6px}
.fail{color:var(--red);font-weight:800}
.pass{color:var(--green);font-weight:800}
footer.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);box-shadow:0 -2px 12px rgba(0,0,0,.08)}
.bar-in{max-width:980px;margin:0 auto;padding:8px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.total-box{display:flex;flex-direction:column;line-height:1.1}
.total-box .lbl{font-size:11px;color:var(--muted)}
.total-box .val{font-size:24px;font-weight:900;color:var(--green)}
.total-box .pf{font-size:12px}
.bar-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:none;border-radius:9px;padding:10px 15px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn-pri{background:var(--green);color:#fff}.btn-pri:hover{background:var(--green2)}
.btn-sec{background:#eef3ee;color:var(--ink);border:1px solid var(--line)}
.btn-sec:hover{background:#e2eae3}
.btn-gold{background:var(--gold);color:#fff}
.dist-email{font-size:12px;color:var(--muted);background:var(--greenL);padding:5px 10px;border-radius:8px;margin-top:6px}
.dist-email b{color:var(--green2)}
/* settings modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal-box h3{margin:0 0 4px;color:var(--green)}
.modal-box p{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.set-row{display:grid;grid-template-columns:120px 1fr;gap:8px;margin-bottom:8px;align-items:center}
.set-row label{font-size:13px;font-weight:600}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.flag{font-size:11px;color:var(--amber);background:#fdf3e3;border:1px solid #f0dcb1;padding:5px 9px;border-radius:7px;margin-top:6px}
@media(max-width:600px){
  .top-in h1{font-size:14px}
  .blk-h{font-size:13px}
  .total-box .val{font-size:20px}
  .btn{padding:9px 11px;font-size:12px}
}
/* view toggle */
.viewtoggle{display:flex;background:rgba(255,255,255,.18);border-radius:20px;padding:3px;margin-left:6px}
.vt{background:transparent;border:none;color:#fff;padding:6px 12px;border-radius:16px;font-size:13px;font-weight:700;cursor:pointer}
.vt.active{background:#fff;color:var(--green)}
/* dashboard */
.dash-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.dash-bar .fld{min-width:150px;flex:1}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .n{font-size:22px;font-weight:900;color:var(--green)}
.stat .l{font-size:11px;color:var(--muted)}
.stat.warn .n{color:var(--amber)}
.stat.ok .n{color:var(--green2)}
.dtable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.dtable th{background:var(--green);color:#fff;padding:9px 8px;text-align:left;font-weight:600;white-space:nowrap;position:sticky;top:0}
.dtable td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}
.dtable tr:hover td{background:var(--greenL)}
.pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:11px;font-weight:700;white-space:nowrap}
.pill-draft{background:#eee;color:#666}
.pill-sub{background:#dbeafe;color:#1e40af}
.pill-app{background:#dcfce7;color:#166534}
.pill-fail{background:#fee2e2;color:#991b1b}
.pill-pass{background:#dcfce7;color:#166534}
.hint{font-size:11px}
.hint.warn{color:var(--amber);font-weight:700}
.row-act{display:flex;gap:4px;flex-wrap:wrap}
.mini{font-size:11px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.mini:hover{background:var(--greenL)}
.mini.pri{background:var(--green);color:#fff;border-color:var(--green)}
.mini.del{color:var(--red)}
.dwrap{overflow-x:auto}
.region-box{background:var(--greenL);border:1px solid #cfe3d0;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.region-box b{color:var(--green2)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}
@media print{
  header.top,footer.bar,#dashboardView,.viewtoggle,.gear,.tabs,.bar-btns,.btn{display:none!important}
  body{background:#fff}
  main{margin:0;max-width:100%}
  .card,.blk{box-shadow:none;break-inside:avoid}
  .badge{print-color-adjust:exact;-webkit-print-color-adjust:exact}
  input,select{border:1px solid #ccc!important;background:#fff!important;color:#000!important}
  .blk-detail,.band,.badge,.sec-title{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1>🏕️ 2026 優異旅團獎勵計劃</h1>
    <span class="sub">港島地域 · 評選期 2025-01-01 至 2025-12-31</span>
    <div class="viewtoggle">
      <button class="vt active" id="vt_form" onclick="switchView('form')">📝 評分表</button>
      <button class="vt" id="vt_dash" onclick="switchView('dashboard')">🗂️ 區概覽</button>
    </div>
    <button class="gear" onclick="openSettings()" title="設定各區提交電郵">⚙</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div id="formView"><div id="form"></div></div>
  <div id="dashboardView" style="display:none"></div>
</main>

<footer class="bar" id="formBar">
  <div class="bar-in">
    <div class="total-box">
      <span class="lbl">總分</span>
      <span class="val" id="totalVal">0</span>
      <span class="pf" id="pfVal">—</span>
    </div>
    <div class="bar-btns">
      <button class="btn btn-sec" onclick="window.print()">🖨️ 列印 / PDF</button>
      <button class="btn btn-sec" onclick="exportSheet()">⬇️ 下載 Excel</button>
      <button class="btn btn-gold" onclick="saveToRegistry()">💾 儲存至區概覽</button>
      <button class="btn btn-pri" onclick="submitEmail()">✉️ 提交到區電郵</button>
    </div>
  </div>
</footer>

<!-- settings -->
<div class="modal" id="setModal">
  <div class="modal-box">
    <h3>⚙️ 設定 — 各區提交電郵綁定</h3>
    <p>為港島地域 7 區各自填寫提交電郵（儲存於本機瀏覽器）。用戶喺表格揀選所屬區後，撳「提交到區電郵」就會自動寄去嗰區綁定嘅電郵。</p>
    <div id="setRows"></div>
    <div class="flag">ℹ️ 提交方式為「mailto」：會開啟你裝置嘅電郵程式，收件人、主旨同分數摘要已自動填好，並同時下載已填好嘅 Excel 供夾附。唔需要任何伺服器或戶口。</div>
    <div class="modal-btns">
      <button class="btn btn-sec" onclick="closeSettings()">取消</button>
      <button class="btn btn-pri" onclick="saveSettings()">儲存</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ===================== 基本資料 ===================== */
const YEAR=2026, EVAL_YEAR=YEAR-1;
// 地域電郵（批核後轉交目的地）；畀我地址後填喺下面即全域預設。留空則用戶可喺「區概覽」逐部裝置設定。
const REGION_EMAIL="";
const DISTRICTS=[
  /* 想做「全域預設」（所有裝置都用同一組電郵），直接喺下面 email:"" 填上各區電郵即可。
     留空嘅話，用戶可喺 APP 右上角 ⚙「設定」逐部裝置綁定（儲存於瀏覽器本機）。 */
  {id:"is_west",name:"港島西區",email:""},
  {id:"vic_city",name:"維多利亞城區",email:""},
  {id:"is_south",name:"港島南區",email:""},
  {id:"wanchai",name:"灣仔區",email:""},
  {id:"is_north",name:"港島北區",email:""},
  {id:"shaukiwan",name:"筲箕灣區",email:""},
  {id:"chaiziwan",name:"柴灣區",email:""},
];

/* ===================== 工具函數 ===================== */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function get(n){
  const els=document.querySelectorAll(`[name="${n}"]`);
  if(els.length===0)return "";
  // radio group（有／無 等）：傳回已選取嘅值
  if(els.length>1||els[0].type==="radio"){
    for(const el of els) if(el.checked) return el.value;
    return "";
  }
  return els[0].value;
}
function num(n){const v=get(n);return v===""?0:(parseFloat(v)||0);}
function str(n){return get(n);}
function setText(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}
function setHTML(id,h){const e=document.getElementById(id);if(e)e.innerHTML=h;}
function tierScore(v,tiers){let r=0;for(const[t,s]of tiers)if(v>=t)r=s;return r;}

function textField(n,l,ph,req){return `<label class="fld"><span>${l}${req?' <span style="color:#c0392b">*</span>':''}</span><input type="text" name="${n}" placeholder="${ph||''}"></label>`;}
function numField(n,l){return `<label class="fld"><span>${l}</span><input type="number" inputmode="numeric" min="0" name="${n}"></label>`;}
function selField(n,l,opts,req){return `<label class="fld"><span>${l}${req?' <span style="color:#c0392b">*</span>':''}</span><select name="${n}"><option value=""></option>${opts.map(o=>`<option>${o}</option>`).join("")}</select></label>`;}
function ynField(n,l,p){return `<div class="yn"><span class="yn-l">${l} <em>(${p}分)</em></span><span class="yn-o"><label><input type="radio" name="${n}" value="有"> 有</label><label><input type="radio" name="${n}" value="無"> 無</label></span></div>`;}

/* ===================== 區塊產生器 ===================== */
function blockMembers(cfg){
  return {key:"members",section:"甲",cfg,
    title(){return "1. 成員人數";},
    max(){return cfg.max;},
    render(){return `
      <div class="blk"><div class="blk-h"><span>${this.title()}</span><span class="pts">[佔${cfg.max}分]</span><span class="badge" id="sc_members">0</span></div>
      <div class="grid2">
        ${numField("members_mBoy","青少年成員 男（人）")}
        ${numField("members_mGirl","青少年成員 女（人）")}
        <div class="ro"><span>全團合計</span><b id="members_total">0</b><span>人</span></div>
        ${numField("members_lBoy","領袖 男（人）")}
        ${numField("members_lGirl","領袖 女（人）")}
        ${numField("members_appoint","持有委任書（人）")}
        ${numField("members_temp","持有暫許委任書（人）")}
        ${numField("members_wood","領袖持有木章（人）")}
      </div>
      <div class="bands" id="members_bands"></div>
      <div class="ratio-note">領袖與成員比例：1位領袖最多對8名成員 → 達標得2分</div>
      <div class="blk-detail" id="det_members"></div></div>`;},
    score(){
      const mBoy=num("members_mBoy"),mGirl=num("members_mGirl"),total=mBoy+mGirl;
      const lBoy=num("members_lBoy"),lGirl=num("members_lGirl"),ltotal=lBoy+lGirl;
      const ap=num("members_appoint"),tp=num("members_temp"),atotal=ap+tp;
      const wood=num("members_wood");
      setText("members_total",total);
      const ms=tierScore(total,cfg.memberTiers),ls=ltotal<2?0:(ltotal>=4?3:2);
      const as=atotal<1?0:(atotal>=2?2:1),rs=(ltotal>0&&total/ltotal<=8)?2:0,ws=wood<1?0:(wood>=2?2:1);
      // bands highlight
      setHTML("members_bands",cfg.bands.map((b,i)=>`<span class="band ${cfg.hitIdx===i&&total>0?'hit':''}">${b}</span>`).join(""));
      // recompute hit
      const bandsEl=$("#members_bands");
      if(bandsEl){let hit=-1;cfg.tierLabels.forEach((t,i)=>{if(total>=t)hit=i;});$$(".band",bandsEl).forEach((el,i)=>el.classList.toggle("hit",i===hit&&total>0));}
      const score=ms+ls+as+rs+ws;
      setHTML("det_members",`成員人數 ${ms} ＋ 領袖人數 ${ls} ＋ 委任書 ${as} ＋ 比例 ${rs} ＋ 木章 ${ws} ＝ <b>${score}/${cfg.max}</b>`);
      return score;
    },
    data(){return [["青少年成員 男（人）",num("members_mBoy")],["女（人）",num("members_mGirl")],["領袖 男（人）",num("members_lBoy")],["女（人）",num("members_lGirl")],["持有委任書（人）",num("members_appoint")],["暫許委任書（人）",num("members_temp")],["木章（人）",num("members_wood")]];}
  };
}

function blockProgressRatio(cfg){
  return {key:"progress",section:"甲",cfg,
    title(){return cfg.title;},
    max(){return cfg.max;},
    render(){return `
      <div class="blk"><div class="blk-h"><span>${cfg.title}</span><span class="pts">[佔${cfg.max}分]</span><span class="badge" id="sc_progress">0</span></div>
      <div class="note">${cfg.note}</div>
      <div class="grid2">${cfg.items.map((it,i)=>numField("progress_"+i,it.n+" 人次")).join("")}</div>
      <div class="bands">${cfg.bands.map(b=>`<span class="band">${b}</span>`).join("")}</div>
      <div class="blk-detail" id="det_progress"></div></div>`;},
    score(){
      let sum=0;cfg.items.forEach((it,i)=>sum+=num("progress_"+i));
      const total=num("members_mBoy")+num("members_mGirl");
      const ratio=total>0?sum/total:0;
      const sc=total>0?tierScore(ratio,cfg.tiers):0;
      setHTML("det_progress",`考獲人次合計 ${sum}，佔全團 ${total} 人 = ${(ratio*100).toFixed(0)}% → <b>${sc}/${cfg.max}</b>`);
      return sc;
    },
    data(){return cfg.items.map((it,i)=>[it.n+" 人次",num("progress_"+i)]);}
  };
}

function blockProgressSum(cfg){
  return {key:"progress",section:"甲",cfg,
    title(){return cfg.title;},
    max(){return "∞";},
    render(){return `
      <div class="blk"><div class="blk-h"><span>${cfg.title}</span><span class="pts">[分數不設上限]</span><span class="badge" id="sc_progress">0</span></div>
      <div class="note">${cfg.note}</div>
      <div class="grid2">${cfg.items.map((it,i)=>numField("progress_"+i,it.n+"（"+it.pts+"分／位）")).join("")}</div>
      <div class="blk-detail" id="det_progress"></div></div>`;},
    score(){let sc=0;cfg.items.forEach((it,i)=>sc+=num("progress_"+i)*it.pts);setHTML("det_progress",`合共 <b>${sc}</b> 分（不設上限）`);return sc;},
    data(){return cfg.items.map((it,i)=>[it.n,num("progress_"+i)]);}
  };
}

function blockTopAward(cfg){
  // cfg.scoreItems (optional): indices whose contribution counts toward total
  // 用於深資/樂行 — 官方模板總分只計 K74（3分獎章），不計 K73（1分獎章）
  const countedIdx = cfg.scoreItems || cfg.items.map((_,i)=>i);
  return {key:"topaward",section:"甲",cfg,
    title(){return cfg.title;},
    max(){return "∞";},
    render(){return `
      <div class="blk"><div class="blk-h"><span>${cfg.title}</span><span class="pts">[分數不設上限]</span><span class="badge" id="sc_topaward">0</span></div>
      <div class="note">${cfg.note}</div>
      <div class="grid2">${cfg.items.map((it,i)=>numField("topaward_"+i,it.n+"（"+it.pts+"分／位）")).join("")}</div>
      <div class="blk-detail" id="det_topaward"></div></div>`;},
    score(){
      let counted=0;

function mkTable(o){
  const cap=(o.max==="∞")?Infinity:o.max;
  const block={key:o.key,section:o.section||"丙",cfg:o,
    title(){return o.title;},
    max(){return o.max;},
    render(){
      const head=o.columns.map(c=>`<th style="${c.w?'width:'+c.w:''}">${c.label}</th>`).join("")+'<th class="sc">得分</th>';
      let body="";
      for(let i=0;i<o.rows;i++){
        let tds=o.columns.map(c=>{
          const nm=`${o.key}_${i}_${c.k}`;
          if(c.type==="select")return `<td><select name="${nm}"><option value=""></option>${c.options.map(op=>`<option>${op}</option>`).join("")}</select></td>`;
          if(c.type==="number")return `<td><input type="number" inputmode="numeric" min="0" name="${nm}"></td>`;
          return `<td><input type="text" name="${nm}"></td>`;
        }).join("")+`<td class="rs" id="${o.key}_${i}_rs">0</td>`;
        body+=`<tr>${tds}</tr>`;
      }
      return `<div class="blk"><div class="blk-h"><span>${o.title}</span><span class="pts">${typeof o.max==="number"?"[佔"+o.max+"分]":"[分數不設上限]"}</span><span class="badge" id="sc_${o.key}">0</span></div>${o.note?`<div class="note">${o.note}</div>`:""}<div class="tblwrap"><table class="dt"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div><div class="blk-detail" id="det_${o.key}"></div></div>`;
    },
    score(){
      let sum=0;
      for(let i=0;i<o.rows;i++){
        const row={};o.columns.forEach(c=>{row[c.k]=str(`${o.key}_${i}_${c.k}`);});
        const filled=row[o.primary||o.columns[0].k];
        let rs=0;if(filled&&filled.trim()!=="")rs=o.rowScore(row,i);
        sum+=rs;setText(`${o.key}_${i}_rs`,rs);
      }
      const sc=Math.min(sum,cap);
      setHTML("det_"+o.key,cap===Infinity?`合共 <b>${sc}</b> 分（不設上限）`:`合共 <b>${sc}/${o.max}</b> 分`);
      return sc;
    },
    data(){
      const rows=[o.columns.map(c=>c.label).concat(["得分"])];
      for(let i=0;i<o.rows;i++){
        const r=o.columns.map(c=>str(`${o.key}_${i}_${c.k}`));
        const filled=str(`${o.key}_${i}_${o.primary||o.columns[0].k}`);
        let rs=0;if(filled&&filled.trim()!=="")rs=o.rowScore(Object.fromEntries(o.columns.map(c=>[c.k,str(`${o.key}_${i}_${c.k}`)])),i);
        rows.push(r.concat([rs]));
      }
      return rows;
    }
  };
  return block;
}

function renderForm(){
  const b=currentBranch;
  let html=headerHTML(b)+minStdHTML(b);
  const sections={"甲":"（甲）童軍旅團標準","乙":"（乙）行政與財務管理","丙":"（丙）訓練與活動"};
  ["甲","乙","丙"].forEach(sec=>{
    const blocks=b.blocks.filter(bl=>bl.section===sec);
    if(!blocks.length)return;
    html+=`<div class="sec-title">${sections[sec]}</div>`;
    blocks.forEach(bl=>{html+=bl.render();});
  });
  html+=sigHTML();
  $("#form").innerHTML=html;
  // attach listeners
  $("#form").querySelectorAll("input,select").forEach(el=>{
    el.addEventListener("input",()=>{recompute();scheduleSave();});
    el.addEventListener("change",()=>{recompute();scheduleSave();});
  });

function recompute(){
  let total=0;
  currentBranch.blocks.forEach(bl=>{const s=bl.score();SCORES[bl.key]=s;setText("sc_"+bl.key,s);total+=s;});
  // min standards
  let fail=false;let anyAns=false;
  for(let i=0;i<4;i++){const v=str("ms_"+i);if(v==="無")fail=true;if(v==="有"||v==="無")anyAns=true;}
  MIN_FAIL=fail;
  setHTML("det_ms",fail?`<span class="fail">⚠ 未達最低標準 — 未符資格獲評選（有項目為「無」）</span>`:(anyAns?`<span class="pass">✓ 已確認全部最低標準為「有」</span>`:"請逐一確認各項最低標準"));
  setText("totalVal",total);
  const pf=fail?"<span class='fail'>未達最低標準</span>":"<span class='pass'>符合最低標準</span>";
  setHTML("pfVal",pf);
  updateDistEmailBox();
}

/* ===================== 提交電郵 ===================== */
function buildEmailBody(){
  const b=currentBranch;
  const L=[];
  L.push(`【${YEAR} 優異旅團獎勵計劃 — ${b.name} 評分表】`);
  L.push(`評選期：${EVAL_YEAR}-01-01 至 ${EVAL_YEAR}-12-31`);
  L.push("");
  L.push("—— 旅團資料 ——");
  L.push(`旅號／旅團：${str("h_groupNo")||"（未填）"}`);
  L.push(`團類別：${str("h_type")||"-"}`);
  L.push(`區別：${str("h_district")||"（未填）"}`);
  L.push(`集會地點：${str("h_meetingPlace")||"-"}`);
  L.push(`集會時間：${str("h_meetingTime")||"-"}`);
  L.push(`負責領袖：${str("h_leader")||"-"}`);
  L.push(`聯絡電話：${str("h_phone")||"-"}`);
  L.push(`電郵：${str("h_email")||"-"}`);
  L.push(`職位：${str("h_position")||"-"}`);
  L.push("");
  L.push("—— 最低標準 ——");
  let fail=false;
  ["最少團員","性別領袖","財政報告","YMIS註冊"].forEach((t,i)=>{const v=str("ms_"+i)||"未填";L.push(`${t}：${v}`);if(v==="無")fail=true;});
  L.push("");
  L.push("—— 各項得分 ——");
  currentBranch.blocks.forEach(bl=>{const m=bl.max();L.push(`${bl.title()}：${SCORES[bl.key]??0} 分${typeof m==="number"?(" / "+m):"（不設上限）"}`);});
  const total=currentBranch.blocks.reduce((a,bl)=>a+(SCORES[bl.key]||0),0);
  L.push("");
  L.push(`★ 總分：${total} 分`);
  L.push(fail?"★ 結果：未達最低標準（不獲評選）":"★ 結果：符合最低標準");
  L.push("");
  L.push("（完整資料見隨附 Excel 檔案，已一併下載，請夾附於此電郵。）");
  L.push(`提交時間：${new Date().toLocaleString("zh-HK")}`);
  return L.join("\n");
}
function submitEmail(){
  recompute();save();
  const dName=str("h_district");
  const d=DISTRICTS.find(x=>x.name===dName);
  if(!d){alert("請先喺「旅團資料」揀選你所屬嘅區別。");return;}
  const emails=getEmails();
  const to=emails[d.id];
  if(!to){alert(`尚未設定「${d.name}」嘅提交電郵。\n請先撳右上角 ⚙ 設定各區電郵。`);openSettings();return;}
  // 必填檢查
  const reqs=[["h_groupNo","旅號"],["h_district","區別"],["h_leader","負責領袖姓名"],["h_phone","聯絡電話"],["h_email","電郵地址"]];
  for(const[f,l]of reqs){if(!str(f)){if(!confirm(`「${l}」尚未填寫。仍要繼續提交嗎？`))return;break;}}
  const subject=`${YEAR} 優異旅團 — ${currentBranch.name} — 旅號 ${str("h_groupNo")||"(未填)"} — ${dName}`;
  const body=buildEmailBody();
  // 先下載 Excel
  exportSheet(true);
  const mailto=`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  window.location.href=mailto;
}

/* ===================== 匯出 Excel / CSV ===================== */
function buildAOA(){
  const b=currentBranch;
  const A=[];
  A.push([`${YEAR} 年優異旅團獎勵計劃 — ${b.name} 評分表`]);
  A.push(["香港童軍總會 ~ 港島地域"]);
  A.push([`評選期：${EVAL_YEAR}-01-01 至 ${EVAL_YEAR}-12-31`]);
  A.push([]);
  A.push(["旅團資料"]);
  A.push(["旅號／旅團",str("h_groupNo")],["團類別",str("h_type")],["區別",str("h_district")],["集會地點",str("h_meetingPlace")],["集會時間",str("h_meetingTime")],["負責領袖",str("h_leader")],["聯絡電話",str("h_phone")],["電郵",str("h_email")],["童軍職位",str("h_position")]);
  A.push([]);
  A.push(["最低標準"]);
  ["最少團員","性別領袖","財政報告","YMIS註冊"].forEach((t,i)=>A.push([t,str("ms_"+i)||"未填"]));
  A.push([]);
  let total=0;
  currentBranch.blocks.forEach(bl=>{
    A.push([bl.title(),"得分： "+(SCORES[bl.key]||0)+(typeof bl.max()==="number"?" / "+bl.max():"")]);
    const d=bl.data();
    if(Array.isArray(d)&&d.length){
      // table blocks: d is array of rows (arrays); others: array of [label,value]
      if(d[0]&&Array.isArray(d[0]))d.forEach(r=>A.push(r));
      else d.forEach(r=>A.push(r));
    }
    total+=SCORES[bl.key]||0;
    A.push([]);
  });
  A.push(["總分",total]);
  return A;
}
function exportSheet(silent){
  recompute();
  const aoa=buildAOA();
  const b=currentBranch;
  const fname=`${YEAR}_DGA_${b.id}_${str("h_groupNo")||"form"}`.replace(/[\\/:*?"<>|]/g,"_");
  if(typeof XLSX!=="undefined"){
    try{
      const ws=XLSX.utils.aoa_to_sheet(aoa);
      ws["!cols"]=[{wch:30},{wch:18},{wch:18},{wch:14},{wch:12}];
      const wb=XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb,ws,b.unit);
      XLSX.writeFile(wb,fname+".xlsx");
      if(!silent)alert("已匯出 Excel（.xlsx）。");
      return;
    }catch(e){console.warn("XLSX export failed, fallback CSV",e);}
  }
  // CSV fallback
  const csv=aoa.map(r=>r.map(c=>`"${String(c==null?"":c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname+".csv";a.click();
  if(!silent)alert("已匯出 CSV（Excel 程式庫未能載入，改用 CSV）。");
}

function collectFields(){

function saveToRegistry(){

  const now=new Date().toISOString();
  const data={id:rec?rec.id:recId(),year:YEAR,branchId:b.id,branchName:b.name,
    groupNo,district:fields.h_district||"",type:fields.h_type||"",leader:fields.h_leader||"",

    meetingPlace:fields.h_meetingPlace||"",meetingTime:fields.h_meetingTime||"",
    fields,scores:Object.assign({},SCORES),total:totalFromScores(),passFail:MIN_FAIL?"fail":"pass",
    dataAOA:buildAOA(),status:rec?rec.status:"草擬",lastYear:rec?!!rec.lastYear:false,
    approvedAt:rec?rec.approvedAt:"",updatedAt:now,createdAt:rec?rec.createdAt:now};
  if(rec)Object.assign(rec,data);else reg.push(data);
  setRegistry(reg);
  alert("✓ 已儲存至區概覽：「"+groupNo+"」（"+b.name+"）\n總分："+data.total+" 分　最低標準："+(MIN_FAIL?"未達":"符合"));
}

function regionEmailBody(rec){
  const L=[];
  L.push("【已批核 — 轉交地域】"+YEAR+" 優異旅團獎勵計劃");
  L.push("");
  L.push("旅團："+rec.groupNo+"（"+rec.branchName+"）");
  L.push("區別："+(rec.district||"-")+"　團類別："+(rec.type||"-"));
  L.push("負責領袖："+(rec.leader||"-")+"　電話："+(rec.phone||"-"));
  L.push("電郵："+(rec.email||"-"));
  L.push("");
  L.push("★ 本年總分："+rec.total+" 分");
  L.push("最低標準："+(rec.passFail==="fail"?"未達":"符合"));
  L.push("");
  L.push("—— 各項得分 ——");
  const b=BRANCHES.find(x=>x.id===rec.branchId);
  if(b)b.blocks.forEach(bl=>{L.push(bl.title()+"："+(rec.scores[bl.key]||0)+" 分");});
  L.push("");
  L.push("批核時間："+new Date().toLocaleString("zh-HK"));
  L.push("（完整資料見隨附 Excel，已一併下載，請夾附於此電郵。）");
  return L.join("\n");
}
function approveAndForward(id,ev){if(ev)ev.stopPropagation();
  const reg=getRegistry();const rec=reg.find(r=>r.id===id);if(!rec)return;
  const re=getRegionEmail();
  if(!re){alert("尚未設定「地域電郵」。請先喺區概覽頂部撳「設定地域電郵」。");return;}
  if(rec.passFail==="fail"){if(!confirm("注意：「"+rec.groupNo+"」未達最低標準。仍要批核並轉交地域？"))return;}
  else if(!confirm("確認批核「"+rec.groupNo+"」（"+rec.branchName+"，總分 "+rec.total+"）並轉交地域？\n地域電郵："+re))return;
  rec.status="已批核";rec.approvedAt=new Date().toISOString();setRegistry(reg);
  exportAOA(rec.dataAOA||buildAOABasic(rec),YEAR+"_DGA_"+rec.branchId+"_"+rec.groupNo);
  const body=regionEmailBody(rec);
  const subject="【已批核】"+YEAR+" 優異旅團 — "+rec.branchName+" — "+rec.groupNo+" — "+(rec.district||"");
  window.location.href="mailto:"+encodeURIComponent(re)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
  renderDashboard();
}
function renderDashboard(){
  const reg=getRegistry().filter(r=>r.year===YEAR);
  const re=getRegionEmail();
  const submitted=reg.filter(r=>r.status==="已遞交"||r.status==="已批核").length;
  const approved=reg.filter(r=>r.status==="已批核").length;
  const draft=reg.filter(r=>r.status==="草擬").length;
  const lastOnly=reg.filter(r=>r.lastYear&&r.status==="草擬").length;
  let rows=reg.slice().sort((a,b)=>(a.district||"").localeCompare(b.district||"")||(a.groupNo||"").localeCompare(b.groupNo||""));
  if(dashDistrict)rows=rows.filter(r=>r.district===dashDistrict);
  if(dashKeyword){const k=dashKeyword.toLowerCase();rows=rows.filter(r=>(r.groupNo+" "+r.branchName+" "+(r.leader||"")).toLowerCase().includes(k));}
  let h="";
  h+='<div class="region-box">📍 地域電郵（批核轉交目的地）：<b>'+(re||"（未設定）")+'</b> <button class="mini pri" onclick="saveRegionEmail()">設定地域電郵</button></div>';
  h+='<div class="stat-row">'+
    '<div class="stat"><div class="n">'+reg.length+'</div><div class="l">本年旅團紀錄</div></div>'+
    '<div class="stat ok"><div class="n">'+submitted+'</div><div class="l">已遞交／已批核</div></div>'+
    '<div class="stat ok"><div class="n">'+approved+'</div><div class="l">已批核轉交</div></div>'+
    '<div class="stat warn"><div class="n">'+lastOnly+'</div><div class="l">⚠ 上年有交今年未交</div></div>'+
    '<div class="stat"><div class="n">'+draft+'</div><div class="l">草擬中</div></div></div>';
  h+='<div class="dash-bar">'+
    '<label class="fld"><span>篩選區別</span><select onchange="dashDistrict=this.value;renderDashboard()"><option value="">全部區別</option>'+DISTRICTS.map(d=>'<option'+(dashDistrict===d.name?' selected':'')+'>'+d.name+'</option>').join("")+'</select></label>'+
    '<label class="fld"><span>搜尋（旅號／分支／領袖，按 Enter）</span><input type="text" value="'+esc(dashKeyword)+'" placeholder="輸入關鍵字…" onchange="dashKeyword=this.value;renderDashboard()"></label>'+
    '<button class="btn btn-sec" onclick="exportRegistry()">⬆ 匯出全部(JSON)</button>'+
    '<button class="btn btn-sec" onclick="importRegistryClick()">⬇ 匯入(JSON)</button>'+
    '<input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importRegistry(this)">'+
    '<button class="btn btn-pri" onclick="switchView(\'form\')">＋ 新增／填寫旅團</button></div>';
  if(!rows.length){
    h+='<div class="empty">未有符合嘅旅團紀錄。<br>請撳「＋ 新增／填寫旅團」填妥評分表後，撳底部「儲存至區概覽」。</div>';
  }else{
    h+='<div class="dwrap"><table class="dtable"><thead><tr>'+
      '<th>旅號／旅團</th><th>分支</th><th>區別</th><th>本年總分</th><th>最低標準</th>'+
      '<th>本年狀態</th><th>上年</th><th>提示</th><th>操作</th></tr></thead><tbody>';
    rows.forEach(r=>{
      const pf=r.passFail==="fail";
      const stPill=r.status==="已批核"?"pill-app":(r.status==="已遞交"?"pill-sub":"pill-draft");
      let hint,hcls="";
      if(r.status==="已批核")hint="✓ 已批核轉交地域";
      else if(r.status==="已遞交")hint="✓ 已遞交（待批核）";
      else if(r.lastYear){hint="⚠ 上年有交，今年未交";hcls="warn";}
      else hint="未遞交";
      h+='<tr style="cursor:pointer" onclick="loadRecordToForm(\''+r.id+'\')">'+
        '<td><b>'+esc(r.groupNo)+'</b><br><span style="font-size:11px;color:#777">'+esc(r.leader||"")+'</span></td>'+
        '<td>'+esc(r.branchName)+'</td><td>'+esc(r.district||"-")+'</td>'+
        '<td><b style="color:var(--green)">'+r.total+'</b></td>'+
        '<td><span class="pill '+(pf?"pill-fail":"pill-pass")+'">'+(pf?"未達":"符合")+'</span></td>'+
        '<td><span class="pill '+stPill+'">'+(r.status||"草擬")+'</span></td>'+
        '<td>'+(r.lastYear?'<span class="pill pill-pass">有</span>':'<span class="pill pill-draft">無</span>')+'</td>'+
        '<td><span class="hint '+hcls+'">'+hint+'</span></td>'+
        '<td class="row-act" onclick="event.stopPropagation()">'+
          '<button class="mini pri" onclick="approveAndForward(\''+r.id+'\',event)">批核轉交</button>'+
          '<button class="mini" onclick="setStatus(\''+r.id+'\',\'已遞交\',event)">標記已遞交</button>'+
          '<button class="mini" onclick="toggleLastYear(\''+r.id+'\',event)">切換上年</button>'+
          '<button class="mini" onclick="loadRecordToForm(\''+r.id+'\',event)">檢視</button>'+
          '<button class="mini del" onclick="deleteRecord(\''+r.id+'\',event)">刪除</button>'+
        '</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='<div style="font-size:11px;color:#777;margin-top:10px">點擊任何一列可載入至評分表檢視／編輯。「切換上年」手動標記該旅團上年曾否遞交。資料儲存於本機瀏覽器；可用「匯出／匯入 JSON」喺不同裝置間整合（例如各旅團領袖匯出自己嘅紀錄，由區幹事匯入整合）。</div>';
  $("#dashboardView").innerHTML=h;
}
function exportRegistry(){
  const reg=getRegistry();
  const blob=new Blob([JSON.stringify({app:"dga-2026",year:YEAR,exportedAt:new Date().toISOString(),registry:reg},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=YEAR+"_DGA_registry.json";a.click();
}
function importRegistryClick(){$("#importFile").click();}
function importRegistry(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      const incoming=Array.isArray(data)?data:(data.registry||[]);
      const reg=getRegistry();let added=0,updated=0;
      incoming.forEach(nr=>{
        const idx=reg.findIndex(r=>r.id===nr.id||(r.branchId===nr.branchId&&r.groupNo===nr.groupNo&&r.year===nr.year));
        if(idx>=0){reg[idx]=Object.assign({},reg[idx],nr);updated++;}else{reg.push(nr);added++;}
      });
      setRegistry(reg);renderDashboard();
      alert("匯入完成：新增 "+added+" 項，更新 "+updated+" 項。");
    }catch(err){alert("匯入失敗：檔案格式不正確。");}
    input.value="";
  };
  reader.readAsText(file);
}
